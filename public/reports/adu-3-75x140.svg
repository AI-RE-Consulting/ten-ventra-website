<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1162 1234" width="100%" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <style>
    .halo { font-weight:700; fill:#ffffff; stroke:#5a5a5e; stroke-width:3; paint-order:stroke; stroke-linejoin:round; }
    .navyhalo { font-weight:700; fill:#2b3a52; stroke:#ffffff; stroke-width:3.5; paint-order:stroke; stroke-linejoin:round; }
    .tick { fill:#2b3a52; font-size:17px; }
    .leg { fill:#2b3a52; font-size:19px; }
  </style>

  <!-- figure background -->
  <rect x="0" y="0" width="1162" height="1234" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1161" height="1233" rx="14" fill="none" stroke="#e3e1de" stroke-width="1"/>

  <!-- plot area -->
  <rect x="128" y="88" width="648" height="1052" fill="#fafaf9" stroke="#2a2a2a" stroke-width="2"/>

  <!-- faint gray grid lines -->
  <g stroke="#eaebee" stroke-width="2">
    <line x1="153.6" y1="88" x2="153.6" y2="1140"/>
    <line x1="216" y1="88" x2="216" y2="1140"/>
    <line x1="278.4" y1="88" x2="278.4" y2="1140"/>
    <line x1="340.8" y1="88" x2="340.8" y2="1140"/>
    <line x1="403.2" y1="88" x2="403.2" y2="1140"/>
    <line x1="465.6" y1="88" x2="465.6" y2="1140"/>
    <line x1="528" y1="88" x2="528" y2="1140"/>
    <line x1="590.4" y1="88" x2="590.4" y2="1140"/>
    <line x1="652.8" y1="88" x2="652.8" y2="1140"/>
    <line x1="715.2" y1="88" x2="715.2" y2="1140"/>
    <line x1="128" y1="112.5" x2="776" y2="112.5"/>
    <line x1="128" y1="268.9" x2="776" y2="268.9"/>
    <line x1="128" y1="425.3" x2="776" y2="425.3"/>
    <line x1="128" y1="581.7" x2="776" y2="581.7"/>
    <line x1="128" y1="738.2" x2="776" y2="738.2"/>
    <line x1="128" y1="894.6" x2="776" y2="894.6"/>
    <line x1="128" y1="1051" x2="776" y2="1051"/>
  </g>

  <!-- buildable area (mint) -->
  <rect x="241" y="200.1" width="418" height="206.5" fill="#cff6ed"/>

  <!-- garage building (gray, non-residential): crosses setback line at right, top-right step notch, bottom-left step -->
  <polygon points="279.5,271.5 654.5,271.5 654.5,282.5 677.5,282.5 677.5,406.5 302.5,406.5 302.5,394.5 279.5,394.5" fill="#93908c"/>
  <polygon points="279.5,271.5 654.5,271.5 654.5,282.5 677.5,282.5 677.5,406.5 302.5,406.5 302.5,394.5 279.5,394.5" fill="none" stroke="#86cf9c" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- residential building (gray, stepped) -->
  <polygon fill="#93908c" points="232.2,447 413,447 413,427.5 461.5,427.5 461.5,438.5 484.5,438.5 484.5,447 629.5,447 629.5,458.5 652.5,458.5 652.5,477 663.5,477 663.5,512 651.5,512 651.5,522 663.5,522 663.5,556 651.5,556 651.5,560.5 663.5,560.5 663.5,624 651.5,624 651.5,631.5 663.5,631.5 663.5,697 651.5,697 651.5,700.5 663.5,700.5 663.5,735 651.5,735 651.5,737.5 663.5,737.5 663.5,782 651.5,782 651.5,791 663.5,791 663.5,855 651.5,855 651.5,858.5 663.5,858.5 663.5,892 651.5,892 651.5,903.5 663.5,903.5 663.5,937 651,937 651,959.5 257.8,959.5 257.8,948.5 232.2,948.5 232.2,755.5 406.5,755.5 406.5,627.5 373.5,627.5 373.5,656.5 256.5,656.5 256.5,644.5 232.2,644.5"/>

  <!-- setback line (4 ft, dotted) -->
  <rect x="241" y="200.1" width="418" height="825.9" fill="none" stroke="#4a5a75" stroke-width="1.5" stroke-dasharray="1.5 3"/>

  <!-- exclusion buffer (red dashed): side verticals sit on the parcel boundary -->
  <path d="M 229 409.5 H 638 A 46 27 0 0 1 684.5 436.5 V 981 A 26 16.5 0 0 1 658.5 997.5 H 229 A 13 13 0 0 1 216 984.5 V 422.5 A 13 13 0 0 1 229 409.5 Z" fill="none" stroke="#f0908a" stroke-width="1.8" stroke-dasharray="7 5"/>
  <path d="M 217 687 L 233 693.5 H 368.5 V 717.5 H 217" fill="none" stroke="#f0908a" stroke-width="1.8" stroke-dasharray="7 5"/>

  <!-- parcel boundary -->
  <rect x="216" y="175" width="468" height="876" fill="none" stroke="#2b3a52" stroke-width="3.5"/>
  <!-- buffer verticals show as muted red dashes on top of the boundary -->
  <line x1="216.5" y1="415" x2="216.5" y2="983" stroke="#a5646b" stroke-width="3" stroke-dasharray="9 5"/>
  <line x1="684.5" y1="437" x2="684.5" y2="979" stroke="#a5646b" stroke-width="3" stroke-dasharray="9 5"/>

  <!-- dimension arrows -->
  <g stroke="#2b3a52" stroke-width="1.6" fill="#2b3a52">
    <line x1="177" y1="184" x2="177" y2="1037"/>
    <polygon points="177,172 172.2,185 181.8,185" stroke="none"/>
    <polygon points="177,1049 172.2,1036 181.8,1036" stroke="none"/>
    <line x1="230" y1="1088" x2="670" y2="1088"/>
    <polygon points="218,1088 231,1083.2 231,1092.8" stroke="none"/>
    <polygon points="682,1088 669,1083.2 669,1092.8" stroke="none"/>
  </g>
  <text x="152" y="613" transform="rotate(-90 152 613)" text-anchor="middle" class="tick">140 ft</text>
  <text x="450" y="1117" text-anchor="middle" class="tick">75 ft</text>

  <!-- ADU placements (translucent look: garage tints them darker where it passes underneath) -->
  <g>
    <rect x="241" y="258.2" width="127.6" height="129.6" fill="#dfba60"/>
    <rect x="368.6" y="258.2" width="126" height="129.6" fill="#dfba60"/>
    <rect x="494.6" y="258.2" width="126.3" height="129.6" fill="#dfba60"/>
    <!-- garage seen through the ADUs: duller tint + faint green dashed top edge -->
    <rect x="279.5" y="271.5" width="341.4" height="116.3" fill="#cc9d47"/>
    <line x1="279.5" y1="271.5" x2="620.9" y2="271.5" stroke="#c1ab49" stroke-width="3" stroke-dasharray="11 5"/>
    <rect x="241" y="258.2" width="127.6" height="129.6" fill="none" stroke="#2b3a52" stroke-width="1.8"/>
    <rect x="368.6" y="258.2" width="126" height="129.6" fill="none" stroke="#2b3a52" stroke-width="1.8"/>
    <rect x="494.6" y="258.2" width="126.3" height="129.6" fill="none" stroke="#2b3a52" stroke-width="1.8"/>
  </g>

  <!-- garage ghost label (seen through translucent ADUs: warm gold) -->
  <g text-anchor="middle" font-size="17" font-weight="700" fill="#ebbb63" stroke="#b98f48" stroke-width="3" paint-order="stroke" stroke-linejoin="round">
    <text x="478" y="331">#1</text>
    <text x="478" y="353">Garage</text>
  </g>

  <!-- ADU labels + pills -->
  <g text-anchor="middle">
    <text x="304.8" y="316" font-size="17" class="halo">ADU #1</text>
    <rect x="272.8" y="326" width="64" height="22" rx="5" fill="#ffffff"/>
    <text x="304.8" y="341.5" font-size="13" fill="#2b3a52">22×20 ft</text>
    <text x="431.6" y="316" font-size="17" class="halo">ADU #2</text>
    <rect x="399.6" y="326" width="64" height="22" rx="5" fill="#ffffff"/>
    <text x="431.6" y="341.5" font-size="13" fill="#2b3a52">22×20 ft</text>
    <text x="557.8" y="316" font-size="17" class="halo">ADU #3</text>
    <rect x="525.8" y="326" width="64" height="22" rx="5" fill="#ffffff"/>
    <text x="557.8" y="341.5" font-size="13" fill="#2b3a52">22×20 ft</text>
  </g>

  <!-- crosshair + coordinates + residential label -->
  <g stroke="#2b3a52" stroke-width="2.5">
    <line x1="441" y1="612" x2="463" y2="612"/>
    <line x1="452" y1="601" x2="452" y2="623"/>
  </g>
  <g text-anchor="middle" font-size="17">
    <text x="458" y="691" class="halo">#2</text>
    <text x="458" y="713" class="halo">Residential</text>
  </g>

  <!-- N arrow -->
  <text x="754" y="115" text-anchor="middle" font-size="23" font-weight="700" fill="#1c2733">N</text>
  <line x1="754" y1="240" x2="754" y2="160" stroke="#1c2733" stroke-width="2"/>
  <polygon points="754,148 748.8,163 759.2,163" fill="#1c2733"/>

  <!-- axis tick labels -->
  <g class="tick" text-anchor="end">
    <text x="118" y="118.5">150 ft</text>
    <text x="118" y="274.9">125 ft</text>
    <text x="118" y="431.3">100 ft</text>
    <text x="118" y="587.7">75 ft</text>
    <text x="118" y="744.2">50 ft</text>
    <text x="118" y="900.6">25 ft</text>
    <text x="118" y="1057">0 ft</text>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="153.6" y="1167">-10 ft</text>
    <text x="216" y="1167">0 ft</text>
    <text x="278.4" y="1167">10 ft</text>
    <text x="340.8" y="1167">20 ft</text>
    <text x="403.2" y="1167">30 ft</text>
    <text x="465.6" y="1167">40 ft</text>
    <text x="528" y="1167">50 ft</text>
    <text x="590.4" y="1167">60 ft</text>
    <text x="652.8" y="1167">70 ft</text>
    <text x="715.2" y="1167">80 ft</text>
  </g>
  <text x="452" y="1201" text-anchor="middle" font-size="21" fill="#2b3a52">Width</text>
  <text x="30" y="614" transform="rotate(-90 30 614)" text-anchor="middle" font-size="21" fill="#2b3a52">Depth</text>

  <!-- title block -->
  <text x="128" y="40" font-size="27" font-weight="700" fill="#2b3a52">ADU Feasibility Analysis</text>
  <text x="128" y="75" font-size="27" font-weight="700" fill="#2b3a52">3 ADU buildings placed</text>

  <!-- legend -->
  <g>
    <rect x="795" y="97" width="353" height="302" rx="4" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/>
    <!-- row 1: Parcel boundary -->
    <rect x="806" y="107.5" width="38" height="19" fill="#ffffff" stroke="#2b3a52" stroke-width="3"/>
    <text x="856" y="123.5" class="leg">Parcel boundary</text>
    <!-- row 2: Setback line -->
    <line x1="806" y1="150" x2="844" y2="150" stroke="#4a5a75" stroke-width="2" stroke-dasharray="2 3.5"/>
    <text x="856" y="156.5" class="leg">Setback line (4 ft)</text>
    <!-- row 3: Buildable area -->
    <rect x="806" y="173.5" width="38" height="19" fill="#cff6ed"/>
    <text x="856" y="189.5" class="leg">Buildable area</text>
    <!-- row 4: Building (high conf.) -->
    <rect x="806" y="206.5" width="38" height="19" fill="#93908c"/>
    <text x="856" y="222.5" class="leg">Building (high conf.)</text>
    <!-- row 5: Building (medium conf.) -->
    <rect x="806" y="239.5" width="38" height="19" fill="#ccab52"/>
    <text x="856" y="255.5" class="leg">Building (medium conf.)</text>
    <!-- row 6: Building (low conf.) -->
    <rect x="806" y="272.5" width="38" height="19" fill="#c4614f"/>
    <text x="856" y="288.5" class="leg">Building (low conf.)</text>
    <!-- row 7: Exclusion buffer -->
    <rect x="806" y="305.5" width="38" height="19" fill="#ffffff" stroke="#f0908a" stroke-width="1.8" stroke-dasharray="5 3.5"/>
    <text x="856" y="321.5" class="leg">Exclusion buffer (6 ft)</text>
    <!-- row 8: Non-residential -->
    <rect x="806" y="338.5" width="38" height="19" fill="#ffffff" stroke="#86cf9c" stroke-width="1.8" stroke-dasharray="5 3.5"/>
    <text x="856" y="354.5" class="leg">Non-residential (no buffer)</text>
    <!-- row 9: ADU placement -->
    <rect x="806" y="371.5" width="38" height="19" fill="#ddab4a" stroke="#2b3a52" stroke-width="1.8"/>
    <text x="856" y="387.5" class="leg">ADU placement</text>
  </g>
</svg>
